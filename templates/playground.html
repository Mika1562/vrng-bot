<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground — Катя</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 1.5rem;
  }
  h1 { color: var(--accent); margin: 0 0 1rem; font-size: 1.4rem; }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1rem;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  input, button, textarea {
    font-size: 0.95rem;
    padding: 0.5rem 0.7rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    width: 100%;
  }
  button {
    background: #2563eb;
    border: none;
    cursor: pointer;
    color: #fff;
    font-weight: 600;
  }
  button:hover:not(:disabled) { background: #1d4ed8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .role-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.6rem;
  }
  .role-btns button {
    width: auto;
    padding: 0.3rem 0.6rem;
    font-size: 0.75rem;
    background: #334155;
  }
  .role-btns button:hover { background: #475569; }
  .field { margin-bottom: 0.8rem; }
  #chat {
    display: flex;
    flex-direction: column;
    height: 70vh;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding-right: 0.5rem;
    margin-bottom: 0.8rem;
  }
  .msg {
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    margin-bottom: 0.6rem;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.45;
  }
  .msg.user { background: #1e40af; color: #e0e7ff; }
  .msg.bot { background: #064e3b; color: #d1fae5; }
  .msg.error {
    background: #7f1d1d;
    color: #fee2e2;
    font-family: monospace;
    font-size: 0.85rem;
  }
  .msg .meta {
    font-size: 0.7rem;
    opacity: 0.7;
    margin-bottom: 0.3rem;
  }
  .role-owner { color: #f472b6; }
  .role-friend { color: #60a5fa; }
  .role-vip { color: #fbbf24; }
  .role-stranger { color: #94a3b8; }
  .row {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }
  .row textarea {
    resize: none;
    height: 3rem;
  }
  .row button {
    width: auto;
    padding: 0.5rem 1.2rem;
  }
  .hint {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.3rem;
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    #chat { height: auto; }
  }
</style>
</head>
<body>
<h1>🧪 Playground — горничная Катя</h1>

<div class="layout">
  <div class="card">
    <div class="field">
      <label>User ID</label>
      <input id="uid" type="text" placeholder="123456789012345678">
      <div class="hint">Кем «прикинуться» перед ботом</div>
    </div>

    <div class="field">
      <label>Display name</label>
      <input id="dname" type="text" placeholder="Госпожа">
      <div class="hint">Подставляется в role_ins</div>
    </div>

    <div class="field">
      <label>Быстрый выбор роли</label>
      <div class="role-btns" id="role-btns">
        <button data-role="owner">owner</button>
        <button data-role="friend">friend</button>
        <button data-role="vip">vip</button>
        <button data-role="stranger">stranger</button>
      </div>
    </div>

    <button onclick="clearChat()" style="background:#475569;">Очистить чат</button>
  </div>

  <div class="card" id="chat">
    <div id="messages"></div>
    <div class="row">
      <textarea id="msg" placeholder="Напишите сообщение… (Ctrl+Enter — отправить)"></textarea>
      <button id="send">Отправить</button>
    </div>
    <div class="hint" id="status"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let known = null;

fetch('/api/whoami')
  .then(r => r.json())
  .then(d => { known = d; })
  .catch(() => { /* тихо игнорируем — кнопки просто не сработают */ });

$('role-btns').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  if (!known) return;

  const role = e.target.dataset.role;
  if (role === 'owner') {
    $('uid').value = known.owner;
    $('dname').value = 'Госпожа';
  } else if (role === 'friend' && known.friends.length) {
    $('uid').value = known.friends[0];
    $('dname').value = 'Вася';
  } else if (role === 'vip' && known.vip.length) {
    $('uid').value = known.vip[0];
    $('dname').value = 'Гость';
  } else if (role === 'stranger') {
    $('uid').value = '999999999999999999';
    $('dname').value = 'Незнакомец';
  }
});

function addMsg(cls, text, meta = '') {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    el.appendChild(m);
  }
  el.appendChild(document.createTextNode(text));
  $('messages').appendChild(el);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function clearChat() {
  $('messages').innerHTML = '';
}

async function send() {
  const uid = $('uid').value.trim();
  const dname = $('dname').value.trim() || ('user_' + uid);
  const text = $('msg').value.trim();
  if (!uid || !text) return;

  addMsg('user', text, `${dname} (${uid})`);
  $('msg').value = '';
  $('send').disabled = true;
  $('status').textContent = 'Думаю…';

  try {
    const res = await fetch('/api/playground', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        user_id: uid,
        display_name: dname,
        message: text,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      addMsg('error', data.error || ('HTTP ' + res.status));
    } else {
      addMsg('bot', data.answer, `Катя → роль: ${data.role}`);
    }
    $('status').textContent = '';
  } catch (e) {
    addMsg('error', 'Сеть: ' + e.message);
    $('status').textContent = '';
  } finally {
    $('send').disabled = false;
    $('msg').focus();
  }
}

$('send').addEventListener('click', send);

$('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
